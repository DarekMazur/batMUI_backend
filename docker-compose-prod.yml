version: '3.9'
services:
  batquiz:
    container_name: batquiz
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: bat-mui-server:latest
    restart: unless-stopped
    env_file: .env
    #    environment:
    #      DATABASE_HOST: ${DATABASE_HOST}
    #      DATABASE_NAME: ${DATABASE_NAME}
    #      DATABASE_USER: ${DATABASE_USER}
    #      DATABASE_PORT: ${DATABASE_PORT}
    #      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    #      API_TOKEN: ${API_TOKEN}
    #      API_USER: ${API_USER}
    #      NODE_ENV: ${NODE_ENV}
    volumes:
      - ${APP_PATH}/lib:/opt/app/lib
      - ${APP_PATH}/package.json:/opt/package.json
      - ${APP_PATH}/package-lock.json:/opt/package-lock.json
      - ${APP_PATH}/.env:/opt/app/.env
    networks:
      - db_network
      - nginx_network

networks:
  db_network:
    name: ${DATABASE_NETWORK_NAME}
    external: true
  nginx_network:
    name: ${NGINX_NETWORK}
    external: true